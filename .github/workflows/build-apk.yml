name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "twa-manifest.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (skip interactive wizard)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass egzersiz123 -keypass egzersiz123 \
            -dname "CN=Egzersiz, OU=Egzersiz, O=Egzersiz, L=Konya, S=Konya, C=TR"

      - name: Build APK with Bubblewrap
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --password egzersiz123 \
            --alias android \
            --aliasPassword egzersiz123

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: egzersiz-apk
          path: app-release-signed.apk
